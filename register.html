<!doctype html>
<html lang="id">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Daftar Akun - FlashVault</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>

<body>
    <div class="auth-page-wrapper">
        <div class="auth-card">
            <div class="auth-header">
                <a href="index.html" class="auth-logo">
                    <i class="fa-solid fa-box-archive"></i>
                    <span>FlashVault</span>
                </a>
                <h2>Buat Akun Baru</h2>
                <p>Mulai tingkatkan ingatan Anda dengan Spaced Repetition.</p>
            </div>

            <form action="dashboard.html" method="GET" class="auth-form">
                <div class="form-group">
                    <label for="regNama">Nama Lengkap</label>
                    <input type="text" id="regNama" class="form-control" placeholder="Contoh: Rama" required />
                </div>

                <div class="form-group">
                    <label for="regEmail">Alamat Email</label>
                    <input type="email" id="regEmail" class="form-control" placeholder="nama@email.com" required />
                </div>

                <div class="form-group">
                    <label for="regPassword">Kata Sandi</label>
                    <input type="password" id="regPassword" class="form-control" placeholder="Minimal 8 karakter"
                        required />
                </div>

                <button type="submit" class="btn-auth-submit">
                    Daftar Akun Gratis
                </button>
            </form>

            <div class="auth-footer">
                Sudah punya akun? <a href="login.html">Masuk di Sini</a>
            </div>

            <a href="index.html" class="back-home-link"><i class="fa-solid fa-arrow-left"></i> Kembali ke Beranda</a>
        </div>
    </div>
</body>

</html>
