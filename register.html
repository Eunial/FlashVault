<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Daftar - FlashVault</title>
</head>
<body>

    <main>
        <header>
            <h1>FlashVault</h1>
            <h2>Buat Akun Baru</h2>
            <p>Mulai perjalanan belajar interaktif Anda bersama FlashVault.</p>
        </header>

        <form action="dashboard.html" method="GET">
            <div>
                <label for="fullname">Nama Lengkap:</label><br>
                <input type="text" id="fullname" name="fullname" placeholder="Nama Lengkap Anda" required>
            </div>

            <br>

            <div>
                <label for="email">Alamat Email:</label><br>
                <input type="email" id="email" name="email" placeholder="nama@email.com" required>
            </div>

            <br>

            <div>
                <label for="password">Kata Sandi:</label><br>
                <input type="password" id="password" name="password" placeholder="Minimal 8 karakter" minlength="8" required>
            </div>

            <br>

            <div>
                <label for="password_confirm">Konfirmasi Kata Sandi:</label><br>
                <input type="password" id="password_confirm" name="password_confirm" placeholder="Ulangi kata sandi" required>
            </div>

            <br>
            <button type="submit">Daftar Akun</button>
        </form>

        <br>

        <p>Sudah punya akun? <a href="login.html">Masuk di sini</a></p>
        <p><a href="index.html">&larr; Kembali ke Beranda</a></p>
    </main>

</body>
</html>
